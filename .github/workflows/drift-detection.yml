    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform Init
        working-directory: ${{ matrix.path }}
        run: terraform init

      - name: Terraform Plan (Drift Check)
        id: plan
        working-directory: ${{ matrix.path }}
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -out=tfplan 2>&1 | tee plan_output.txt
          EXIT_CODE=$?
          echo "exitcode=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Report No Drift
        if: steps.plan.outputs.exitcode == '0'
        run: echo "✅ No drift detected in ${{ matrix.name }}"

      - name: Create Issue if Drift Detected
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ matrix.path }}/plan_output.txt', 'utf8');

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift'
            });

            const existingIssue = existingIssues.data.find(
              issue => issue.title.includes('${{ matrix.name }}')
            );

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## Drift Still Present\n\n**Detected:** ${new Date().toISOString()}\n\n\`\`\`\n${planOutput.slice(0, 60000)}\n\`\`\``
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Drift Detected: ${{ matrix.name }}',
                body: `## Platform Infrastructure Drift Detected\n\n**Module:** \`${{ matrix.path }}\`\n**Detected:** ${new Date().toISOString()}\n\n### Terraform Plan Output\n\`\`\`\n${planOutput.slice(0, 60000)}\n\`\`\`\n\n### Resolution\n1. **Accept drift:** Update Terraform code to match current state\n2. **Correct drift:** Run \`terraform apply\` to restore desired state\n3. **Investigate:** Determine what made the change and why`,
                labels: ['drift', 'infrastructure', 'platform']
              });
            }

      - name: Fail if Error
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "❌ Terraform plan failed for ${{ matrix.name }}"
          cat ${{ matrix.path }}/plan_output.txt
          exit 1

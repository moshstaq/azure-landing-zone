name: Platform Plan

on:
  pull_request:
    branches: [ main ]
    paths:
      - "platform/**"
      - ".github/workflows/terraform-matrix-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            platform/**

      - name: Determine affected modules
        id: set-matrix
        run: |
          MODULES=$(cat .github/terraform-modules.json)
          CHANGED="${{ steps.changed-files.outputs.all_changed_files }}"
          echo "Changed files: $CHANGED"

          AFFECTED_MODULES="[]"

          for path in $(echo "$MODULES" | jq -r '.modules[] | select(.ci_enabled == true) | .path'); do
            for file in $CHANGED; do
              if [[ "$file" == "$path"* ]]; then
                MODULE=$(echo "$MODULES" | jq -c ".modules[] | select(.path == \"$path\")")
                AFFECTED_MODULES=$(echo "$AFFECTED_MODULES" | jq -c ". + [$MODULE]")
                break
              fi
            done
          done

          AFFECTED_MODULES=$(echo "$AFFECTED_MODULES" | jq -c 'unique | sort_by(.tier)')
          echo "Affected modules: $AFFECTED_MODULES"

          if [ "$AFFECTED_MODULES" == "[]" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":$AFFECTED_MODULES}" >> $GITHUB_OUTPUT
          fi

  plan:
    name: Plan - ${{ matrix.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: ${{ matrix.path }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ matrix.path }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.path }}
        run: |
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Create plan summary
        working-directory: ${{ matrix.path }}
        run: |
          {
            echo "MODULE_NAME=${{ matrix.name }}"
            echo "MODULE_PATH=${{ matrix.path }}"
            echo "PLAN_EXITCODE=${{ steps.plan.outputs.exitcode }}"
            echo "---PLAN_OUTPUT_START---"
            cat plan_output.txt
            echo "---PLAN_OUTPUT_END---"
          } > plan_summary.txt

      - name: Upload plan summary
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.name }}
          path: ${{ matrix.path }}/plan_summary.txt
          retention-days: 1

  comment:
    name: Post PR Comment
    needs: [ detect-changes, plan ]
    if: always() && needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all plan artifacts
        uses: actions/download-artifact@v4
        with:
          path: plans
          pattern: plan-*

      - name: Build comment body
        id: build-comment
        run: |
          COMMENT="## 🏗️ Platform Terraform Plan Results\n\n"

          for dir in plans/plan-*; do
            if [ -d "$dir" ]; then
              SUMMARY_FILE="$dir/plan_summary.txt"
              MODULE_NAME=$(grep "^MODULE_NAME=" "$SUMMARY_FILE" | cut -d'=' -f2)
              MODULE_PATH=$(grep "^MODULE_PATH=" "$SUMMARY_FILE" | cut -d'=' -f2)
              EXITCODE=$(grep "^PLAN_EXITCODE=" "$SUMMARY_FILE" | cut -d'=' -f2)
              PLAN_OUTPUT=$(sed -n '/---PLAN_OUTPUT_START---/,/---PLAN_OUTPUT_END---/p' "$SUMMARY_FILE" | sed '1d;$d')

              if [ "$EXITCODE" == "0" ]; then
                STATUS="✅"
              elif [ "$EXITCODE" == "2" ]; then
                STATUS="⚠️"
              else
                STATUS="❌"
              fi

              PLAN_SUMMARY=$(echo "$PLAN_OUTPUT" | grep -E "Plan:|No changes" | tail -1)
              [ -z "$PLAN_SUMMARY" ] && PLAN_SUMMARY="See details below"

              COMMENT+="### ${STATUS} ${MODULE_NAME}\n"
              COMMENT+="**Path:** \`${MODULE_PATH}\`\n"
              COMMENT+="**Summary:** ${PLAN_SUMMARY}\n\n"
              COMMENT+="<details>\n<summary>Show Plan Output</summary>\n\n\`\`\`hcl\n${PLAN_OUTPUT}\n\`\`\`\n</details>\n\n---\n\n"
            fi
          done

          COMMENT+="*Pushed by @${{ github.actor }} • Workflow: \`${{ github.workflow }}\`*"
          echo -e "$COMMENT" > comment.md

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('comment.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('🏗️ Platform Terraform Plan Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  no-changes:
    name: No CI-Enabled Modules Changed
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: echo "No CI-enabled platform modules were affected by this PR"
